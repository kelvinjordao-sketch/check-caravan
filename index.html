<title>Check Caravan VOARE</title>
<style>
/* Layout: painel de instrumentos — barra de abas fixa, conteúdo numa coluna de leitura, cartões só onde há um procedimento */
:root{
  --bg:#e7eaed; --surface:#f6f7f8; --surface-2:#dde2e6; --ink:#121619; --muted:#55606a; --line:#c3cad0;
  --accent:#006b8c; --accent-ink:#ffffff; --mag:#a1007f; --green:#1f7a35; --amber:#9a5b00; --red:#b3261e;
  --amber-bg:#fbedd6; --red-bg:#f8dcda; --green-bg:#dcefe0;
  --panel:#3c4248; --panel-2:#2c3136; --panel-line:#5a636b; --screen:#0d1115; --sky:#2f7fc1; --ground:#7a5a35; --panel-ink:#e9edf0;
  --f-disp:"B612","Segoe UI",Roboto,Arial,sans-serif; --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"B612 Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1114; --surface:#171b1f; --surface-2:#20262b; --ink:#e6eaed; --muted:#8d98a2; --line:#2c343b;
  --accent:#3cc8f0; --accent-ink:#04141b; --mag:#f264d6; --green:#4cc76a; --amber:#f0a33a; --red:#ff6b61;
  --amber-bg:#3a2a10; --red-bg:#3d1916; --green-bg:#13301b;
  --panel:#2a2f34; --panel-2:#1c2024; --panel-line:#434b52; --screen:#05080a; --sky:#245f93; --ground:#5c4428; --panel-ink:#dfe4e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#171b1f; --surface-2:#20262b; --ink:#e6eaed; --muted:#8d98a2; --line:#2c343b;
  --accent:#3cc8f0; --accent-ink:#04141b; --mag:#f264d6; --green:#4cc76a; --amber:#f0a33a; --red:#ff6b61;
  --amber-bg:#3a2a10; --red-bg:#3d1916; --green-bg:#13301b;
  --panel:#2a2f34; --panel-2:#1c2024; --panel-line:#434b52; --screen:#05080a; --sky:#245f93; --ground:#5c4428; --panel-ink:#dfe4e8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 8px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font:700 11px/1 var(--f-disp);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.brand h1{margin:0;font:700 clamp(22px,4.6vw,30px)/1.1 var(--f-disp);letter-spacing:-.01em;text-wrap:balance}
.speed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:13px;font-family:var(--f-disp)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .row{display:flex;gap:4px;min-width:max-content}
nav.tabs button{border:0;background:transparent;padding:12px 12px 10px;cursor:pointer;font:700 13px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:20px}
h2{font:700 20px/1.2 var(--f-disp);margin:0 0 6px;text-wrap:balance}
h3{font:700 15px/1.25 var(--f-disp);margin:0;letter-spacing:.02em;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.groupname{font:700 11px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.mcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-width:0}
.mcard:hover{border-color:var(--accent)}
.mcard .id{font:700 12px var(--f-mono);color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mcard .pt{font-weight:600;font-size:16px;line-height:1.25}
.mcard .en{font:400 12px/1.3 var(--f-disp);color:var(--muted)}
.known{color:var(--green);font:700 11px var(--f-disp);letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--f-disp);letter-spacing:.05em;padding:4px 7px;border-radius:5px;white-space:nowrap}
.cas-r{background:var(--red);color:#fff}
.cas-a{background:var(--amber);color:#111}
.role{min-width:44px;justify-content:center;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.role.PF{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.role.PM{background:var(--mag);color:#fff;border-color:transparent}
.role.CMD{background:var(--ink);color:var(--bg);border-color:transparent}
.role.COP{background:var(--green);color:#fff;border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font:700 13px/1 var(--f-disp);letter-spacing:.03em}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{padding:6px 9px;font-size:12px}
.btn svg{width:15px;height:15px;flex:none}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon:hover{border-color:var(--accent);color:var(--accent)}
.icon svg{width:16px;height:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.back{border:0;background:none;color:var(--accent);cursor:pointer;font:700 13px var(--f-disp);padding:0;margin-bottom:12px}
.dhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.dhead .en{font:700 14px var(--f-disp);color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.why{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:15px}
.steps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:start}
.step:first-child{border-top:0}
.step .n{font:700 14px var(--f-mono);color:var(--muted);padding-top:2px}
.line1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:700 16px/1.25 var(--f-disp)}
.line1 .fill{flex:1 1 20px;border-bottom:2px dotted var(--line);min-width:16px;transform:translateY(-4px)}
.act{color:var(--accent)}
.pron{font:400 14px/1.35 var(--f-mono);color:var(--mag);margin-top:3px}
.ptx{font-size:15px;color:var(--muted);margin-top:2px}
.condh{background:var(--surface-2);font:700 12px var(--f-disp);letter-spacing:.06em;padding:8px 12px;border-top:1px solid var(--line)}
.hidden-step .line1,.hidden-step .pron,.hidden-step .ptx{filter:blur(7px);user-select:none}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.link{border:0;background:none;color:var(--accent);font:700 12px var(--f-disp);cursor:pointer;padding:2px 0}
.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px}
.box h3{margin-bottom:10px}
table{border-collapse:collapse;width:100%}
.tbl{overflow-x:auto}
.tbl td,.tbl th{padding:8px 8px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.tbl th{font:700 11px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
.tbl td.v{font:700 14px var(--f-mono);color:var(--accent);white-space:nowrap}
.tbl tr.sub td{font:700 12px var(--f-disp);color:var(--muted);background:var(--surface-2)}
.note{border-left:3px solid var(--amber);background:var(--amber-bg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.note.red{border-color:var(--red);background:var(--red-bg)}
.note.ok{border-color:var(--green);background:var(--green-bg)}
.phase{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.phase>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.phase>header .bar{width:6px;align-self:stretch;border-radius:3px}
.bar.y{background:#e3b52a}.bar.b{background:#2a74b8}
.phase>header .ttl{flex:1 1 180px;min-width:0}
.phase>header .ttl b{font:700 15px var(--f-disp);display:block}
.phase>header .ttl span{font-size:13px;color:var(--muted)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.ci:first-of-type{border-top:0}
.ci .who{font:700 11px var(--f-disp);color:var(--muted);letter-spacing:.05em}
.ci .flag{font-size:13px;color:var(--amber);margin-top:4px}
.ci .ff{color:var(--red);font:700 11px var(--f-disp)}
.btns{display:flex;gap:6px;align-items:flex-start}
.callrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.callrow:first-of-type{border-top:0}
.callrow .say{font:700 15px/1.3 var(--f-disp)}
/* drill */
.drill{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.drill .dtop{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:640px;width:100%;margin:0 auto}
.drill .prog{font:700 13px var(--f-mono);color:var(--muted)}
.drill .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:640px;width:100%;margin:0 auto;min-height:0;overflow:auto}
.drill .ask{font:700 clamp(22px,6vw,32px)/1.2 var(--f-disp);text-wrap:balance}
.drill .ans{font:700 clamp(24px,7vw,38px)/1.15 var(--f-disp);color:var(--accent);text-wrap:balance}
.drill .lbl{font:700 11px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drill .pron{font-size:16px}
.drill .dfoot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:640px;width:100%;margin:0 auto}
.drill .dfoot .btn{padding:14px 18px;font-size:15px}
.barp{height:4px;background:var(--line);border-radius:2px;overflow:hidden;max-width:640px;width:100%;margin:8px auto 0}
.barp i{display:block;height:100%;background:var(--accent);width:0}
/* ordem */
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;cursor:pointer;font:700 13px var(--f-disp);text-align:left}
.pool button.bad{border-color:var(--red);background:var(--red-bg)}
.answer{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.answer li{background:var(--green-bg);border-radius:8px;padding:8px 10px;font:700 13px var(--f-disp)}
/* painel */
.panelsvg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hz{cursor:pointer}
.hz .z{fill:var(--panel);stroke:var(--panel-line);stroke-width:2}
.hz:hover .z,.hz.on .z{stroke:var(--accent);stroke-width:4}
.hz text,.svgt{fill:var(--panel-ink);font:700 15px var(--f-disp);pointer-events:none}
.svgs{font-size:12px!important;opacity:.8}
.ctl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0}
.ctl.hl{background:var(--amber-bg);margin-inline:-14px;padding-inline:14px}
.ctl b{font:700 15px var(--f-disp)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;font:700 11px var(--f-mono);padding:3px 6px;cursor:pointer}
/* quiz */
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;font:600 15px var(--f-body)}
.opts button.right{border-color:var(--green);background:var(--green-bg)}
.opts button.wrong{border-color:var(--red);background:var(--red-bg)}
.score{font:700 44px/1 var(--f-mono);color:var(--accent)}
ol.plan{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.flags{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.voice-warn{display:none}
@media (max-width:520px){.step{grid-template-columns:22px minmax(0,1fr)}.step .side{grid-column:2;flex-direction:row;align-items:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function pron(s){
  return String(s).replace(/[“”"()]/g,"").split(/(\s+|\/|,)/).map(t=>{
    if(!t.trim()||t==="/"||t===",") return t==="/"?" / ":t;
    const k=t.toUpperCase().replace(/[.:;]$/,"");
    return PR[k]!==undefined ? PR[k] : t.toLowerCase();
  }).join("").replace(/\s+/g," ").trim();
}

/* ---------- voz ---------- */
let rate = store.get("rate", 0.8);
const hasTTS = "speechSynthesis" in window;
let voice = null;
function pickVoice(){ if(!hasTTS) return; const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Microsoft/i.test(v.name)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if(hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function toSpeech(s){
  return String(s).replace(/_{2,}/g," ").replace(/[“”"]/g,"")
   .replace(/STAND BY ALT\. POWER/g,"standby alternator power").replace(/STBY ALT PWR/g,"standby alternator power")
   .replace(/\bSTBY\b/g,"standby").replace(/\bPWR\b/g,"power").replace(/\bLDG\b/g,"landing").replace(/\bRQRD\b/g,"required")
   .replace(/\bFWD\b/g,"forward").replace(/\bKIAS\b/g,"knots").replace(/\bKT\b/g,"knots").replace(/\bFT\b/g,"feet")
   .replace(/\bRPM\b/g,"R P M").replace(/\bCBs?\b/g,"circuit breakers").replace(/\bATC\b/g,"A T C").replace(/\bFMA\b/g,"F M A")
   .replace(/\bQNH\b/g,"Q N H").replace(/\bAP\b/g,"A P").replace(/\bYD\b/g,"Y D").replace(/\bITT\b/g,"I T T").replace(/\bNG\b/g,"N G")
   .replace(/\bQTY\b/g,"quantity").replace(/\bR\/T\b/g,"R T").replace(/\bCTRL\b/g,"control").replace(/\bTO\/APR\b/g,"takeoff approach")
   .replace(/\s*\/\s*/g,", ").toLowerCase();
}
function say(texts, onend){
  if(!hasTTS){ onend&&onend(); return; }
  speechSynthesis.cancel();
  const arr = Array.isArray(texts)?texts:[texts];
  arr.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(toSpeech(t));
    u.lang="en-US"; u.rate=rate; if(voice) u.voice=voice;
    if(i===arr.length-1 && onend) u.onend=onend;
    speechSynthesis.speak(u);
  });
}

let tab = store.get("tab","inicio"); if(!TABS.some(t=>t[0]===tab)) tab="inicio";
const tabsEl = $("#tabs");
tabsEl.innerHTML = TABS.map(([k,l])=>`<button role="tab" id="t-${k}" data-tab="${k}" aria-selected="${k===tab}">${l}</button>`).join("");
tabsEl.onclick = e=>{ const b=e.target.closest("[data-tab]"); if(b) go(b.dataset.tab); };
function go(k, arg){
  tab=k; store.set("tab",k);
  tabsEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===k));
  if(hasTTS) speechSynthesis.cancel();
  ({inicio:rInicio, mem:rMem, ckl:rCkl, call:rCall, lim:rLim, pan:rPan, quiz:rQuiz})[k](arg);
  window.scrollTo({top:0});
}
const main = $("#main");

/* ---------- Início ---------- */
function rInicio(){
  const flags = [];
  CKL.forEach(p=>p.items.forEach(it=>{ if(it[4]&&it[4].flag) flags.push(`<b>${esc(p.p)} · ${esc(it[0])}:</b> ${esc(it[4].flag)}`); }));
  flags.push(`<b>Piloto automático:</b> ${esc(NOTE_CONFLICT)}`);
  flags.push(`<b>Landing Checklist:</b> o título da tabela diz “lido pelo PF”, mas a regra do SOP é PM lê e PF responde.`);
  flags.push(`<b>Falha do motor em voo:</b> o cartão de memória (POH) usa 95 KIAS. O SOP VOARE usa 85 KIAS. No check da VOARE, siga o SOP.`);
  main.innerHTML = `
  <h2>Como usar</h2>
  <p class="lead">Tudo aqui vem do SOP VOARE Rev. 00 e dos cartões de memória do Caravan G1000. O inglês aparece como está no avião, com a pronúncia em <span style="color:var(--mag);font-family:var(--f-mono)">ROXO</span> e o botão de som para ouvir.</p>
  ${hasTTS?"":`<p class="note red">Este navegador não tem voz. Abra no Chrome ou no Safari do celular para ouvir o inglês.</p>`}
  <div class="stack">
    <div class="box"><h3>Plano de estudo até o check</h3>
      <ol class="plan">
        <li><b>Memory items.</b> Leia cada um no modo Estudar, depois feche os olhos no modo Testar. Marque “Já sei” quando acertar 3 vezes seguidas.</li>
        <li><b>Checklist.</b> Escolha seu papel (você lê ou responde) e use “Treinar em voz alta”. Fale junto com a voz até sair natural.</li>
        <li><b>Callouts.</b> Decolagem, transição, ILS e arremetida. São as frases que o examinador mais cobra.</li>
        <li><b>Limites e painel.</b> Saiba os números e onde fica cada botão dos memory items.</li>
        <li><b>Simulado.</b> 10 perguntas misturadas. Repita até passar de 9.</li>
      </ol>
    </div>
    <div class="box"><h3>Regras do SOP que caem no check</h3>
      <ul class="flags">
        <li>Checklist é sempre em inglês (SOP B.14).</li>
        <li>Quem lê anuncia o nome do checklist no início e fala “<b>… CHECKLIST COMPLETED</b>” no fim.</li>
        <li>No solo o <b>copiloto lê</b> e o comandante responde. Em voo o <b>PM lê</b> e o PF responde.</li>
        <li>Onde o checklist tem “____”, fale o valor real. Onde diz “AS RQRD”, fale a posição real, nunca “as required”.</li>
        <li>Em emergência: voe o avião, faça os memory items, e só em altitude segura leia o checklist.</li>
        <li>O PM cuida da manete de condição e da manete da hélice. O PF cuida da manete de potência.</li>
      </ul>
    </div>
    <div class="box"><h3>Confirme com o instrutor</h3>
      <p class="ptx" style="margin:0 0 10px">O SOP e o cartão impresso não batem nestes pontos:</p>
      <ul class="flags">${flags.map(f=>`<li>${f}</li>`).join("")}</ul>
    </div>
  </div>`;
}

/* ---------- Memory items ---------- */
let known = store.get("known", {});
function casChip(c){ return c?`<span class="chip cas-${c[0]}">${esc(c[1])}</span>`:""; }
function rMem(id){
  if(id) return memDetail(id);
  const groups = [...new Set(MEM.map(m=>m.grp))];
  const nk = MEM.filter(m=>known[m.id]).length;
  main.innerHTML = `<h2>Memory items</h2>
   <p class="lead">${nk} de ${MEM.length} marcados como “Já sei”. Toque num item para estudar, testar e montar na ordem.</p>
   ${groups.map(g=>`<div class="groupname">${esc(g)}</div><div class="grid">${MEM.filter(m=>m.grp===g).map(m=>`
     <button class="mcard" data-mem="${m.id}"><span class="id"><span>${m.id}</span>${known[m.id]?'<span class="known">JÁ SEI</span>':""}</span>
     <span class="pt">${esc(m.pt)}</span><span class="en">${esc(m.en)}</span>${m.cas?`<span>${casChip(m.cas)}</span>`:""}</button>`).join("")}</div>`).join("")}
   <div class="groupname">Fluxos do SOP VOARE (quem faz o quê)</div>
   <div class="stack">${Object.keys(SOP).map(k=>sopBox(k)).join("")}</div>
   <div class="groupname">Pouso forçado e na água</div>
   <div class="stack">${FORCED.map(f=>simpleBox(f.t,f.steps)).join("")}</div>
   <div class="groupname">Panes de sistema (não são memória: leia no QRH)</div>
   <div class="stack">${SYS.map(s=>simpleBox(`${s.pt} · ${s.t}`, s.steps, s.cas)).join("")}</div>`;
  main.querySelectorAll("[data-mem]").forEach(b=>b.onclick=()=>rMem(b.dataset.mem));
}
function sopBox(k){
  const f=SOP[k];
  const rows=f.steps.map(s=> s[0]===""&&!s[2] ? `<tr class="sub"><td colspan="3">${esc(s[1])}</td></tr>` :
   `<tr><td><span class="chip role ${s[0]}">${s[0]}</span></td><td><b style="font-family:var(--f-disp)">${esc(s[1])}${s[2]?` — <span class="act">${esc(s[2])}</span>`:""}</b><div class="pron">${esc(pron(s[1]+" "+s[2]))}</div><div class="ptx">${esc(s[3])}</div></td><td>${playBtn((s[1]+" "+s[2]).trim())}</td></tr>`).join("");
  return `<div class="box"><h3>${esc(f.t)}</h3>${f.call?`<p class="ptx" style="margin:6px 0 0">${esc(f.call)}</p>`:""}<div class="tbl"><table>${rows}</table></div>${f.note?`<p class="note" style="margin:10px 0 0">${esc(f.note)}</p>`:""}</div>`;
}
function simpleBox(t, steps, cas){
  return `<div class="box"><h3>${esc(t)} ${casChip(cas)}</h3><div class="tbl"><table>${steps.map((s,i)=>`<tr><td style="font-family:var(--f-mono);color:var(--muted)">${i+1}</td><td><b style="font-family:var(--f-disp)">${esc(s[0])} — <span class="act">${esc(s[1])}</span></b><div class="ptx">${esc(s[2])}</div></td><td>${playBtn(s[0]+" "+s[1])}</td></tr>`).join("")}</table></div></div>`;
}
function stepRow(m, i, n, hidden){
  const s=m.steps[i];
  return `<li class="step${hidden?" hidden-step":""}" data-i="${i}"><span class="n">${n}</span><div style="min-width:0">
    <div class="line1"><span>${esc(s[0])}</span><span class="fill"></span><span class="act">${esc(s[1])}</span></div>
    <div class="pron">${esc(pron(s[0]+" "+s[1]))}</div><div class="ptx">${esc(s[2])}</div></div>
    <div class="side">${playBtn(s[0]+" "+s[1], s[0])}<button class="link" data-zone="${s[3]}" data-ctl="${esc(s[0])}">Ver no painel</button></div></li>`;
}
function memDetail(id, mode){
  mode = mode||"study";
  const m = MEM.find(x=>x.id===id);
  const idx = MEM.indexOf(m);
  const all = m.steps.map((s,i)=>s[0]+" "+s[1]);
  let body="";
  if(mode==="order"){
    body = `<p class="ptx">Toque nos itens na ordem certa.</p><ol class="answer" id="ans"></ol><div class="pool" id="pool" style="margin-top:10px">${shuffle(m.steps.map((s,i)=>i)).map(i=>`<button data-o="${i}">${esc(m.steps[i][0])} — ${esc(m.steps[i][1])}</button>`).join("")}</div><div id="omsg" style="margin-top:12px"></div>`;
  } else {
    const hid = mode==="test";
    let rows="";
    if(m.cond){ m.cond.forEach(([h,ids])=>{ rows+=`<li class="condh">${esc(h)}</li>`; ids.forEach(i=>{ rows+=stepRow(m,i,m.id==="E4"&&i===2?5:i+1,hid); }); }); }
    else m.steps.forEach((s,i)=>rows+=stepRow(m,i,i+1,hid));
    body = `<ol class="steps" id="steps">${rows}</ol>${hid?`<div class="toolbar" style="margin-top:10px"><button class="btn pri" id="reveal">Mostrar próximo</button><button class="btn" id="revall">Mostrar tudo</button></div>`:""}`;
  }
  const sops=[m.sop,m.sop2].filter(Boolean);
  main.innerHTML = `<button class="back" id="back">← Todos os memory items</button>
   <div class="dhead"><span class="id" style="font:700 13px var(--f-mono);color:var(--muted)">${m.id} · ${esc(m.grp)}</span>
    <h2 style="margin:0">${esc(m.pt)}</h2>
    <div class="en">${esc(m.en)} ${playBtn(m.en)} ${casChip(m.cas)}</div>
    <div class="why">${esc(m.why)}</div></div>
   <div class="toolbar" style="margin-bottom:12px">
    <div class="seg" role="group" aria-label="Modo"><button data-mode="study" aria-pressed="${mode==="study"}">Estudar</button><button data-mode="test" aria-pressed="${mode==="test"}">Testar</button><button data-mode="order" aria-pressed="${mode==="order"}">Montar na ordem</button></div>
    <button class="btn" id="playall">${ICON_PLAY} Ouvir tudo</button>
    <button class="btn" id="known" aria-pressed="${!!known[m.id]}">${known[m.id]?"✓ Já sei":"Marcar “Já sei”"}</button>
   </div>
   ${body}
   ${sops.length?`<div class="groupname">Como a VOARE faz (SOP)</div><div class="stack">${sops.map(sopBox).join("")}</div>`:""}
   <div class="toolbar" style="margin-top:20px;justify-content:space-between">
    ${idx>0?`<button class="btn" data-mem="${MEM[idx-1].id}">← ${MEM[idx-1].id}</button>`:"<span></span>"}
    ${idx<MEM.length-1?`<button class="btn" data-mem="${MEM[idx+1].id}">${MEM[idx+1].id} →</button>`:""}
   </div>`;
  $("#back").onclick=()=>rMem();
  main.querySelectorAll("[data-mem]").forEach(b=>b.onclick=()=>{memDetail(b.dataset.mem, mode);window.scrollTo({top:0});});
  main.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>memDetail(id,b.dataset.mode));
  $("#playall").onclick=()=>say([m.en].concat(all));
  $("#known").onclick=()=>{ if(known[m.id]) delete known[m.id]; else known[m.id]=1; store.set("known",known); memDetail(id,mode); };
  main.querySelectorAll("[data-zone]").forEach(b=>b.onclick=()=>go("pan",{z:b.dataset.zone, c:b.dataset.ctl}));
  if(mode==="test"){
    const hs=()=>[...main.querySelectorAll(".hidden-step")];
    $("#reveal").onclick=()=>{ const h=hs()[0]; if(h){ h.classList.remove("hidden-step"); const s=m.steps[+h.dataset.i]; say(s[0]+" "+s[1]); } if(!hs().length) $("#reveal").textContent="Fim. Repetir"; if(!hs().length) $("#reveal").onclick=()=>memDetail(id,"test"); };
    $("#revall").onclick=()=>hs().forEach(h=>h.classList.remove("hidden-step"));
  }
  if(mode==="order"){
    let next=0; const ans=$("#ans");
    $("#pool").onclick=e=>{ const b=e.target.closest("[data-o]"); if(!b) return; const i=+b.dataset.o;
      if(i===next){ ans.insertAdjacentHTML("beforeend",`<li>${next+1}. ${esc(m.steps[i][0])} — ${esc(m.steps[i][1])}</li>`); b.remove(); next++; say(m.steps[i][0]+" "+m.steps[i][1]);
        if(next===m.steps.length) $("#omsg").innerHTML=`<p class="note ok">Ordem certa. <button class="link" id="again">Fazer de novo</button></p>`, $("#again").onclick=()=>memDetail(id,"order");
      } else { b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),600); } };
  }
}

/* ---------- Drill genérico ---------- */
const drill = $("#drill");
function runDrill(title, cards){
  let i=0, shown=false;
  drill.hidden=false; document.body.style.overflow="hidden";
  function close(){ drill.hidden=true; document.body.style.overflow=""; if(hasTTS) speechSynthesis.cancel(); }
  function draw(){
    const c=cards[i]; shown=false;
    drill.innerHTML = `<div class="dtop"><button class="btn sm" id="dx">Fechar</button><span class="prog">${esc(title)} · ${i+1}/${cards.length}</span></div>
     <div class="barp"><i style="width:${(i/cards.length*100).toFixed(1)}%"></i></div>
     <div class="stage">
      ${c.who?`<div><span class="chip role ${c.who.split(" ")[0]}">${esc(c.who)}</span></div>`:""}
      <div class="lbl">${esc(c.askLbl||"")}</div>
      <div class="ask">${esc(c.ask)}</div>
      ${c.askPr?`<div class="pron">${esc(c.askPr)}</div>`:""}
      ${c.hint?`<div class="ptx">${esc(c.hint)}</div>`:""}
      <div id="ansbox" hidden><div class="lbl">${esc(c.ansLbl||"Resposta")}</div><div class="ans">${esc(c.ans)}</div>${c.ansPr?`<div class="pron">${esc(c.ansPr)}</div>`:""}${c.ansPt?`<div class="ptx">${esc(c.ansPt)}</div>`:""}</div>
     </div>
     <div class="dfoot">
      ${c.askSay?`<button class="btn" id="dra">${ICON_PLAY} Repetir</button>`:""}
      <button class="btn pri" id="dgo">${esc(c.btn||"Ver resposta")}</button>
     </div>`;
    $("#dx").onclick=close;
    if(c.askSay){ $("#dra").onclick=()=>say(c.askSay); say(c.askSay); }
    $("#dgo").onclick=()=>{
      if(!shown){ shown=true; $("#ansbox").hidden=false; if(c.ansSay) say(c.ansSay); $("#dgo").textContent = i<cards.length-1?"Próximo":"Terminar"; }
      else if(i<cards.length-1){ i++; draw(); } else close();
    };
  }
  draw();
}

/* ---------- Checklist ---------- */
let role = store.get("role","read");
function rCkl(){
  main.innerHTML = `<h2>Checklist em inglês</h2>
   <p class="lead">Respostas conforme as tabelas do SOP, que às vezes diferem do cartão (marcado em âmbar). Escolha seu papel e treine em voz alta: o app faz a parte do outro piloto.</p>
   <div class="toolbar" style="margin-bottom:16px"><span class="ptx">Meu papel:</span>
    <div class="seg" role="group" aria-label="Papel"><button data-role="read" aria-pressed="${role==="read"}">Eu leio (COP / PM)</button><button data-role="resp" aria-pressed="${role==="resp"}">Eu respondo (CMD / PF)</button></div></div>
   <div class="stack">${CKL.map((p,pi)=>`
    <section class="phase"><header><span class="bar ${p.c}"></span><div class="ttl"><b>${esc(p.p)}</b><span>${esc(p.pt)} · ${p.silent?`silencioso (${p.reader})`:`${p.reader} lê, ${p.resp} responde`}</span></div>
     <button class="btn sm pri" data-drill="${pi}">Treinar em voz alta</button></header>
     ${p.items.map(it=>{ const o=it[4]||{}; return `<div class="ci"><div style="min-width:0">
       <div class="line1"><span>${esc(it[0])}</span><span class="fill"></span><span class="act">${esc(it[1])}</span></div>
       <div class="pron">${esc(pron(it[0]))} — ${esc(pron(it[1].replace(/_+/g,"…")))}</div>
       <div class="ptx">${esc(it[3])} ${it[2]?`<span class="who">· responde: ${esc(it[2])}</span>`:""} ${o.ff?'<span class="ff">· 1º VOO</span>':""}</div>
       ${o.flag?`<div class="flag">${esc(o.flag)}</div>`:""}</div>
       <div class="btns">${playBtn(it[0],"item")}${playBtn(o.sp||it[1],"resposta")}</div></div>`;}).join("")}
    </section>`).join("")}</div>`;
  main.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{role=b.dataset.role;store.set("role",role);rCkl();});
  main.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>cklDrill(CKL[+b.dataset.drill]));
}
function cklDrill(p){
  const name=p.p+" CHECKLIST", cards=[];
  const iRead = role==="read" || p.silent;
  if(iRead) cards.push({askLbl:"Anuncie", ask:name, askPr:pron(name), btn:"Ouvir como fica", ansLbl:"Assim", ans:name, ansSay:name});
  else cards.push({askLbl:"O outro piloto anuncia", ask:name, askSay:name, btn:"Começar", ansLbl:"", ans:"Pronto para responder"});
  p.items.forEach(it=>{
    const o=it[4]||{}, rsp=it[1], rspSay=o.sp||it[1];
    if(p.silent) cards.push({askLbl:"Confira e diga em silêncio", ask:it[0], askPr:pron(it[0]), hint:it[3], ans:rsp, ansSay:rspSay, ansPr:pron(rsp), btn:"Ver posição"});
    else if(iRead) cards.push({who:p.reader, askLbl:"Você lê em voz alta", ask:it[0], askPr:pron(it[0]), hint:it[3], btn:"Falei. Ouvir resposta", ansLbl:`${it[2]} responde`, ans:rsp, ansPr:pron(rsp.replace(/_+/g,"…")), ansSay:rspSay, ansPt:o.flag||""});
    else cards.push({who:p.reader, askLbl:"O outro piloto lê", ask:it[0], askSay:it[0], hint:"Responda em voz alta e depois confira.", btn:"Ver a resposta certa", ansLbl:"Você responde", ans:rsp, ansPr:pron(rsp.replace(/_+/g,"…")), ansSay:rspSay, ansPt:it[3]+(o.flag?" · "+o.flag:"")});
  });
  const done=name+" COMPLETED";
  if(iRead) cards.push({askLbl:"Para fechar, fale", ask:done, askPr:pron(done), btn:"Ouvir", ans:done, ansSay:done});
  else cards.push({askLbl:"O outro piloto fecha", ask:done, askSay:done, btn:"Fim", ans:"Checklist completo"});
  runDrill(p.p, cards);
}

/* ---------- Callouts ---------- */
function rCall(){
  main.innerHTML = `<h2>Callouts do SOP</h2><p class="lead">Quem fala, o que fala e o que significa. Use “Treinar” para ver o significado em português e tentar falar em inglês antes de ouvir.</p>
   <div class="stack">${CALL.map((c,ci)=>`<section class="phase"><header><div class="ttl"><b>${esc(c.t)}</b><span>SOP ${esc(c.s)}${c.note?" · "+esc(c.note):""}</span></div><button class="btn sm pri" data-cd="${ci}">Treinar</button></header>
     ${c.rows.map(r=>`<div class="callrow"><span class="chip role ${r[0]}">${r[0]}</span><div style="min-width:0"><div class="say">${esc(r[1])}</div><div class="pron">${esc(pron(r[1]))}</div><div class="ptx">${esc(r[2])}</div></div>${playBtn(r[1])}</div>`).join("")}</section>`).join("")}</div>`;

}

/* ---------- Painel ---------- */
function panelSVG(){
  const z=(id,inner)=>`<g class="hz" data-z="${id}" tabindex="0" role="button" aria-label="${esc(PANEL[id].t)}">${inner}</g>`;
  const screen=(x,y,w,h,pfd)=>`<rect class="z" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><rect x="${x+10}" y="${y+10}" width="${w-20}" height="${h-20}" rx="4" fill="var(--screen)"/>${pfd?`<rect x="${x+30}" y="${y+18}" width="${w-60}" height="${(h-36)/2}" fill="var(--sky)"/><rect x="${x+30}" y="${y+18+(h-36)/2}" width="${w-60}" height="${(h-36)/2}" fill="var(--ground)"/><line x1="${x+30}" x2="${x+w-30}" y1="${y+18+(h-36)/2}" y2="${y+18+(h-36)/2}" stroke="#fff" stroke-width="2"/>`:`<rect x="${x+18}" y="${y+18}" width="38" height="${h-36}" fill="var(--panel-2)"/><circle cx="${x+37}" cy="${y+42}" r="12" fill="none" stroke="#4cc76a" stroke-width="3"/><circle cx="${x+37}" cy="${y+78}" r="12" fill="none" stroke="#4cc76a" stroke-width="3"/>`}`;
  return `<svg class="panelsvg" viewBox="0 0 1000 650" role="img" aria-label="Esquema do painel do Caravan G1000">
   <path d="M40 150 Q500 30 960 150 Z" fill="var(--panel-2)"/>
   <rect x="40" y="150" width="920" height="300" rx="14" fill="var(--panel-2)"/>

/* ---------- Simulado ---------- */
// onde cada passo aparece (para explicar a opção errada)
const STEP_WHERE = {};
MEM.forEach(m=>m.steps.forEach((s,i)=>{ const k=s[0]+" — "+s[1]; (STEP_WHERE[k]=STEP_WHERE[k]||[]).push(`${m.id} ${m.pt} (item ${i+1})`); }));
function seqText(m){ return m.steps.map((s,i)=>`${i+1}. ${s[0]} — ${s[1]}`).join(" · "); }
function buildPool(){
  const pool=[];
  const allSteps=Object.keys(STEP_WHERE);
  MEM.forEach(m=>{
    if(m.steps.length<2 || m.cond) return;
    const k=Math.floor(Math.random()*m.steps.length); const right=m.steps[k][0]+" — "+m.steps[k][1];
    const own=shuffle(m.steps.map(s=>s[0]+" — "+s[1]).filter(x=>x!==right)).slice(0,1);
    const others=own.concat(shuffle(allSteps.filter(x=>x!==right && !own.includes(x))).slice(0,3-own.length));
    pool.push({q:`${m.pt} (${m.en}): qual é o item ${k+1}?`, a:right, o:shuffle([right,...others]), t:"Memory items", mem:m.id,
      exp:`A sequência completa é: ${seqText(m)}. ${m.why}`,
      wp:p=>{ const own=m.steps.findIndex(s=>s[0]+" — "+s[1]===p); if(own>=0) return `Esse passo é deste mesmo procedimento, mas é o item ${own+1}, não o ${k+1}. A ordem importa.`; const w=STEP_WHERE[p]; return w?`Esse passo pertence a outro procedimento: ${w.slice(0,2).join("; ")}.`:""; }});
  });
  MEM.filter(m=>m.cas).forEach(m=>{
    const right=m.pt; const others=shuffle(MEM.filter(x=>x!==m).map(x=>x.pt)).slice(0,3);
    pool.push({q:`Apareceu a mensagem CAS ${m.cas[1]} (${m.cas[0]==="r"?"vermelha":"âmbar"}). Qual procedimento?`, a:right, o:shuffle([right,...others]), t:"Memory items", mem:m.id,
      exp:`${m.cas[1]} aciona o ${m.id} ${m.en}: ${seqText(m)}.`,
      wp:p=>{ const o=MEM.find(x=>x.pt===p); return o?`“${o.pt}” é o ${o.id}${o.cas?`, que aparece com a mensagem ${o.cas[1]}`:", que não tem mensagem CAS própria"}.`:""; }});
  });
  QX.forEach(x=>pool.push({q:x[0], a:x[1], o:shuffle([x[1],...x[2]]), exp:x[3], t:x[4]}));
  return shuffle(pool).slice(0,10);
}
const fmtDate = ts => { const d=new Date(ts); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };
const scoreColor = s => s>=9?"var(--green)":s>=7?"var(--amber)":"var(--red)";
function rQuiz(){
  const hist = store.get("hist",[]);
  const n=hist.length, avg=n?(hist.reduce((a,h)=>a+h.s,0)/n):0, best=n?Math.max(...hist.map(h=>h.s)):0, last=n?hist[n-1].s:0;
  const rank = hist.map((h,i)=>({...h,i})).sort((a,b)=>b.s-a.s||b.d-a.d).slice(0,10);
  const topic={}; hist.forEach(h=>Object.entries(h.tp||{}).forEach(([t,[r,tot]])=>{ topic[t]=topic[t]||[0,0]; topic[t][0]+=r; topic[t][1]+=tot; }));
  const topics=Object.entries(topic).map(([t,[r,tot]])=>({t,pct:r/tot,r,tot})).sort((a,b)=>a.pct-b.pct);
  const recent=hist.slice(-15);
  main.innerHTML = `<h2>Simulado</h2><p class="lead">10 perguntas sorteadas. Depois de cada resposta aparece a explicação, e no fim um resumo dos erros. Tudo fica salvo neste celular.</p>
   <button class="btn pri" id="qs" style="padding:14px 20px;font-size:15px">Começar nova prova</button>
   ${n?`
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:18px">
    ${[["Provas feitas",n],["Média",avg.toFixed(1)],["Melhor",best+"/10"],["Última",last+"/10"]].map(([l,v])=>`<div class="box" style="padding:12px"><div class="lbl" style="font:700 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">${l}</div><div style="font:700 26px var(--f-mono);margin-top:4px">${v}</div></div>`).join("")}
   </div>
   <div class="box" style="margin-top:12px"><h3>Evolução (últimas ${recent.length})</h3>
    <div style="display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:10px;border-bottom:1px solid var(--line)" role="img" aria-label="Notas das últimas provas">
     ${recent.map(h=>`<div title="${h.s}/10 · ${fmtDate(h.d)}" style="flex:1;max-width:28px;height:${Math.max(4,h.s*10)}%;background:${scoreColor(h.s)};border-radius:3px 3px 0 0"></div>`).join("")}
    </div><div class="ptx" style="font-size:12px;margin-top:4px">Verde 9–10 · âmbar 7–8 · vermelho abaixo de 7</div></div>
   <div class="box" style="margin-top:12px"><h3>Ranking das suas provas</h3><div class="tbl"><table>
    <tr><th>#</th><th>Nota</th><th>Data</th><th>Prova</th></tr>
    ${rank.map((h,p)=>`<tr><td style="font:700 14px var(--f-mono)">${p+1}º</td><td style="font:700 15px var(--f-mono);color:${scoreColor(h.s)}">${h.s}/10</td><td>${fmtDate(h.d)}</td><td class="ptx">nº ${h.i+1}</td></tr>`).join("")}
   </table></div></div>
   ${topics.length?`<div class="box" style="margin-top:12px"><h3>Acertos por assunto</h3><div class="stack" style="gap:8px;margin-top:6px">
    ${topics.map(x=>`<div><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px"><span>${esc(x.t)}</span><span style="font-family:var(--f-mono)">${Math.round(x.pct*100)}% (${x.r}/${x.tot})</span></div><div style="height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${x.pct*100}%;background:${x.pct>=.9?"var(--green)":x.pct>=.7?"var(--amber)":"var(--red)"}"></i></div></div>`).join("")}
    </div><p class="ptx" style="margin:10px 0 0">O assunto de cima é o que você mais erra. Comece a revisão por ele.</p></div>`:""}
   <div class="box" style="margin-top:12px"><h3>Histórico</h3>
    ${hist.slice().reverse().map((h,j)=>`<details style="border-top:1px solid var(--line);padding:8px 0"><summary style="cursor:pointer;display:flex;gap:10px;align-items:center"><b style="font-family:var(--f-mono);color:${scoreColor(h.s)}">${h.s}/10</b><span>Prova nº ${n-j}</span><span class="ptx">${fmtDate(h.d)}</span></summary>
     ${(h.w||[]).length?h.w.map(w=>errCard(w)).join(""):`<p class="ptx">Sem erros.</p>`}</details>`).join("")}
    <div id="clr" style="margin-top:10px"><button class="link" id="clr1">Apagar histórico</button></div></div>`:`<p class="ptx" style="margin-top:14px">Faça a primeira prova para começar o ranking.</p>`}`;
  $("#qs").onclick=()=>quiz(buildPool(),0,0,[],{});
  const c1=$("#clr1"); if(c1) c1.onclick=()=>{ $("#clr").innerHTML=`<span class="ptx">Apagar todas as ${n} provas?</span> <button class="btn sm" id="clrY">Sim, apagar</button> <button class="btn sm" id="clrN">Cancelar</button>`; $("#clrY").onclick=()=>{store.set("hist",[]);rQuiz();}; $("#clrN").onclick=rQuiz; };
}
function errCard(w){
  return `<div style="border-left:3px solid var(--red);padding:8px 10px;margin:8px 0;background:var(--surface-2);border-radius:0 8px 8px 0">
   <div style="font-weight:600">${esc(w.q)}</div>
   <div style="font-size:14px;margin-top:4px">Você marcou: <b style="color:var(--red)">${esc(w.p)}</b></div>
   <div style="font-size:14px">Certo: <b style="color:var(--green)">${esc(w.a)}</b></div>
   ${w.wp?`<div class="ptx" style="font-size:14px;margin-top:4px">${esc(w.wp)}</div>`:""}
   <div style="font-size:14px;margin-top:4px">${esc(w.exp||"")}</div>
   ${w.mem?`<button class="link" data-rev="${w.mem}" style="margin-top:4px">Revisar ${w.mem} →</button>`:""}</div>`;
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-rev]"); if(b){ go("mem"); memDetail(b.dataset.rev); } });
function quiz(qs,i,score,wrong,tp){
  if(i>=qs.length){
    const hist=store.get("hist",[]); hist.push({d:Date.now(), s:score, w:wrong, tp}); store.set("hist",hist.slice(-100));
    const pos=hist.slice().sort((a,b)=>b.s-a.s||b.d-a.d).findIndex(h=>h.d===hist[hist.length-1].d)+1;
    main.innerHTML = `<h2>Resultado</h2><div class="score">${score}/10</div>
      <p class="lead" style="margin-top:8px">${pos}º lugar entre suas ${hist.length} provas. ${score>=9?"Pronto para o check nesses tópicos.":score>=7?"Quase. Leia o resumo dos erros.":"Leia o resumo dos erros, revise e tente de novo."}</p>
      ${wrong.length?`<div class="box"><h3>Resumo dos erros</h3>${wrong.map(errCard).join("")}</div>`:`<p class="note ok">Nenhum erro nesta prova.</p>`}
      <div class="toolbar" style="margin-top:14px"><button class="btn pri" id="qa">Nova prova</button><button class="btn" id="qh">Ver ranking e histórico</button></div>`;
    $("#qa").onclick=()=>quiz(buildPool(),0,0,[],{}); $("#qh").onclick=rQuiz; window.scrollTo({top:0}); return;
  }
  const q=qs[i];
  main.innerHTML = `<p class="prog" style="font:700 13px var(--f-mono);color:var(--muted)">Pergunta ${i+1}/10 · acertos ${score} · ${esc(q.t)}</p><h2 style="margin-bottom:14px">${esc(q.q)}</h2>
   <div class="opts">${q.o.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="qn" style="margin-top:14px"></div>`;
  main.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const p=b.dataset.o, ok=p===q.a;
    main.querySelectorAll("[data-o]").forEach(x=>{ x.disabled=true; if(x.dataset.o===q.a) x.classList.add("right"); });
    tp[q.t]=tp[q.t]||[0,0]; tp[q.t][1]++; if(ok) tp[q.t][0]++;
    const wp = !ok && q.wp ? q.wp(p) : "";
    if(!ok){ b.classList.add("wrong"); wrong.push({q:q.q,a:q.a,p,exp:q.exp,wp,mem:q.mem||""}); }
    $("#qn").innerHTML=`<div class="note ${ok?"ok":"red"}"><b>${ok?"Certo.":"Errado. O certo é: "+esc(q.a)}</b>${wp?`<div style="margin-top:4px">${esc(wp)}</div>`:""}<div style="margin-top:4px">${esc(q.exp)}</div></div>
     <div class="toolbar" style="margin-top:12px"><button class="btn pri" id="qnext">${i<9?"Próxima":"Ver resultado"}</button></div>`;
    $("#qnext").onclick=()=>quiz(qs,i+1,score+(ok?1:0),wrong,tp);
  });
}
